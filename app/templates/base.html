<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>{% block title %}cText.ir{% endblock %}</title>

  <meta name="description" content="{% block meta_description %}cText.ir – share text instantly. Encrypted, password-protected, auto-expiring pastes.{% endblock %}" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />

  <link rel="canonical" href="{% block canonical %}https://ctext.ir/{% endblock %}" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/static/fonts/Vazir-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/styles.css?v=2" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem("ctext-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="cText home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 3 12l5 6"/><path d="m16 6 5 6-5 6"/></svg>
        </span>
        <span class="brand-name">ctext<span class="brand-tld">.ir</span></span>
      </a>

      <nav class="topnav">
        <a class="navlink" href="/">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>New</span>
        </a>
        <button class="iconbtn" type="button" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </header>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <span>© 2026 cText.ir</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span>Encrypted at rest · auto-expiring</span>
      <span class="footer-spacer"></span>
      <span>Powered by <a href="https://t.me/DevRouter" target="_blank" rel="noopener">URANIUM</a></span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var root = document.documentElement;
      document.getElementById("themeToggle").addEventListener("click", function () {
        var current = root.getAttribute("data-theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("ctext-theme", next); } catch (e) {}
      });
    })();

    function showToast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1600);
    }

    function copyText(text, btn) {
      var done = function () {
        showToast("Copied to clipboard");
        if (btn) {
          btn.classList.add("is-done");
          setTimeout(function () { btn.classList.remove("is-done"); }, 1400);
        }
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      } else {
        fallbackCopy(text); done();
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
